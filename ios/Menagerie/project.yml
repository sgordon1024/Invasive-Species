name: Menagerie
options:
  bundleIdPrefix: com.invasivespecies
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Menagerie:
    type: application
    platform: iOS
    sources:
      - path: Menagerie
        excludes:
          - "Info.plist"
          - "**/.gitkeep"
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.invasivespecies.menagerie
        INFOPLIST_FILE: Menagerie/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
